name: Publish to npm

on:
  repository_dispatch:
    types: [publish_shipmail_mcp]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm pack --dry-run instead of publishing"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Install current npm
        run: npm install -g npm@latest

      - name: Check package version is unpublished
        id: package
        if: ${{ github.event_name == 'repository_dispatch' || !inputs.dry_run }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Version already published::Skipping npm publish for ${package_name}@${package_version}."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run package pack
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: npm pack --dry-run

      - name: Publish package
        if: ${{ (github.event_name == 'repository_dispatch' || !inputs.dry_run) && steps.package.outputs.published != 'true' }}
        run: npm publish --access public --provenance

      - name: Install MCP Registry publisher
        if: ${{ github.event_name == 'repository_dispatch' || !inputs.dry_run }}
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        if: ${{ github.event_name == 'repository_dispatch' || !inputs.dry_run }}
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: ${{ github.event_name == 'repository_dispatch' || !inputs.dry_run }}
        run: ./mcp-publisher publish
